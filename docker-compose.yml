services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: larkmoor_hub
      POSTGRES_USER: larkmoor
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - larkmoor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larkmoor -d larkmoor_hub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  larkmoor_postgres:
